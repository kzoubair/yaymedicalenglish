<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yay Medical English</title>
  <meta name="description" content="Spaced-repetition flashcards for medical and everyday American English (B2–C1), with Arabic prompts. Works offline.">
  <meta name="theme-color" content="#0E1116">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yay Medical">
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/noto-sans-arabic-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved appearance before the first paint (no flash).
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("yme-progress") || "{}").settings || {};
        var t = s.theme || "dark";
        if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* default theme */ }
    })();
  </script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="overlay-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="update-bar" role="status"></div>
  <noscript><p style="padding:16px">Yay Medical English needs JavaScript.</p></noscript>

  <script src="vocabulaire.js"></script>
  <script src="js/strings.js"></script>
  <script src="js/wordmatch.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/corrector.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
